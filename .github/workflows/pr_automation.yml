name: PR & Commit Automation

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-automation:
    name: Auto-Label & Verify Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Label PR by Sprint & Requirement Type
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title || ""} ${pr.body || ""} ${pr.head.ref || ""}`;
            const labels = [];

            if (/sprint[-_\s]?1|WACDP-[459]/i.test(text)) labels.push("Sprint-1");
            if (/sprint[-_\s]?2|WACDP-(6|7|8|10|11)/i.test(text)) labels.push("Sprint-2");
            if (/FR-\d+/i.test(text)) labels.push("FR");
            if (/NFR-\d+/i.test(text)) labels.push("NFR");
            if (/SEC-REQ/i.test(text)) labels.push("SEC-REQ");

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels
                });
              } catch (e) {
                console.log("Skipping label attachment:", e.message);
              }
            }
