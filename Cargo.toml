[package]
name = "wagg"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
log = "0.4.34"
mysql_async = { version = "0.37.1", features = ["chrono"] }
pretty_env_logger = "0.5.0"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
